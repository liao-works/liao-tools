name: UI Refresh · Visual Smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'public/illustrations/**'
      - '.github/workflows/ui-refresh-visual.yml'
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Prepare browser
        run: pnpm dlx playwright install --with-deps chromium
      - name: Launch UI preview
        shell: bash
        run: |
          mkdir -p ui-screenshots
          pnpm dev -- --host 127.0.0.1 > /tmp/liao-vite.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/liao-vite.log
          exit 1
      - name: Capture pages
        shell: bash
        run: |
          pnpm dlx playwright screenshot --browser chromium --wait-for-timeout 1400 --viewport-size "1440,900" http://127.0.0.1:5173/ ui-screenshots/home-desktop.png
          pnpm dlx playwright screenshot --browser chromium --wait-for-timeout 1400 --viewport-size "1440,900" http://127.0.0.1:5173/tax ui-screenshots/tariff-desktop.png
          pnpm dlx playwright screenshot --browser chromium --wait-for-timeout 1400 --viewport-size "390,844" http://127.0.0.1:5173/ ui-screenshots/home-compact.png
          pnpm dlx playwright screenshot --browser chromium --wait-for-timeout 1400 --viewport-size "1440,900" http://127.0.0.1:5173/alta ui-screenshots/alta-desktop.png
      - name: Upload visual review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liao-ui-r5-screenshots
          path: ui-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
