name: Generate pastel globe icons once

# One-off materialization of binary icon assets into the feature branch.
# Remove this workflow after its generated assets are committed.
on:
  push:
    branches:
      - feat/pastel-globe-logo
    paths:
      - public/app-icon.svg
      - .github/workflows/brand-icons-once.yml

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image build dependencies
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13' 'CairoSVG>=2.7,<3'
      - name: Generate Windows, macOS, web and legacy icon assets
        run: python scripts/generate_brand_assets.py
      - name: Commit generated icon binaries to this branch
        shell: bash
        run: |
          set -euo pipefail
          git add src-tauri/icons public/logo.png src/assets/logo.png src/assets/logo-64.png src/assets/logo-128.png
          if git diff --cached --quiet; then
            echo "No icon assets changed"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'assets(brand): regenerate multi-resolution desktop and web icons'
          git push origin "HEAD:${GITHUB_REF_NAME}"
