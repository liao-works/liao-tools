name: R11 · Synchronize Signed Updater Lockfiles
on:
  pull_request:
    paths:
      - 'package.json'
      - 'src-tauri/Cargo.toml'
      - '.github/workflows/ui-r11-lockfiles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-lockfiles:
    # NEVER write to a fork or protected main. This is exclusively for this PR branch.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/ui-refresh-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve pnpm lockfile (no dependency scripts)
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Resolve Cargo.lock without compiling
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null
      - name: Commit regenerated lockfiles on R11 feature branch only
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add pnpm-lock.yaml src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo 'Lockfiles are already in sync.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(deps): lock official Tauri signed updater and process plugins'
          git push origin "HEAD:refs/heads/$BRANCH"
