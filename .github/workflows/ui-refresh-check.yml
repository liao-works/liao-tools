name: UI Refresh · Frontend Validation
on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ui-refresh-check.yml'
      - '.github/workflows/release.yml'
      - 'scripts/verify-release-assets.cjs'
      - 'tests/verify-release-assets.test.cjs'
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types --test tests/hs-code.test.mjs
      - run: node --test tests/verify-release-assets.test.cjs
      - run: pnpm run build
