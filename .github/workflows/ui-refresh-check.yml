name: UI Refresh · Frontend Validation
on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ui-refresh-check.yml'
      - '.github/workflows/release.yml'
      - 'scripts/verify-release-assets.cjs'
      - 'tests/verify-release-assets.test.cjs'
      - 'scripts/build-signed-updater-manifest.cjs'
      - 'tests/build-signed-updater-manifest.test.cjs'
      - 'scripts/prepare-signed-release.cjs'
      - 'tests/prepare-signed-release.test.cjs'
      - 'scripts/verify-signed-release-manifest.cjs'
      - 'tests/verify-signed-release-manifest.test.cjs'
      - 'tests/release-workflow-contract.test.cjs'
      - 'tests/signed-release-cli-rehearsal.test.cjs'
      - 'scripts/release-version-gate.cjs'
      - 'tests/release-version-gate.test.cjs'
      - 'scripts/verify-signed-release-cryptography.cjs'
      - 'tests/verify-signed-release-cryptography.test.cjs'
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types --test tests/hs-code.test.mjs
      - run: node --test tests/verify-release-assets.test.cjs tests/build-signed-updater-manifest.test.cjs tests/prepare-signed-release.test.cjs tests/verify-signed-release-manifest.test.cjs
      - run: node --test tests/release-workflow-contract.test.cjs
      - run: node --test tests/signed-release-cli-rehearsal.test.cjs
      - run: node --test tests/release-version-gate.test.cjs
      - name: Install Minisign for real ephemeral Ed25519 signature checks
        run: sudo apt-get update -qq && sudo apt-get install -y minisign
      - run: node --test tests/verify-signed-release-cryptography.test.cjs
      - run: pnpm run build
