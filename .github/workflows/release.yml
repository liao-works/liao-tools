name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
    paths:
      - 'package.json'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/tauri.conf.json'
  workflow_dispatch:

jobs:
  prepare-tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify synchronized versions, create tag, dispatch multi-platform release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          node <<'NODE'
          const fs = require('fs');
          const version = require('./package.json').version;
          const config = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const manifest = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const lock = fs.readFileSync('src-tauri/Cargo.lock', 'utf8');
          const ownPackage = lock.split('[[package]]').find(block => /name = "liao-tools"/.test(block));
          if (config.version !== version || !manifest.includes('version = "' + version + '"') ||
              !ownPackage || !ownPackage.includes('version = "' + version + '"')) {
            throw new Error('Release version mismatch across package/config/Cargo manifest/lock');
          }
          NODE
          if git show-ref --tags --verify --quiet "refs/tags/${TAG}"; then
            echo "::error::Tag ${TAG} already exists; refusing to publish over it"
            exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' tag -a "${TAG}" -m "Liao Tools ${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"
          gh workflow run release.yml --ref "${TAG}"
          echo "Triggered multi-platform release for ${TAG}"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate tagged version and read committed release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const pkg = require('./package.json');
          const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
          const toml = fs.readFileSync('src-tauri/Cargo.toml','utf8');
          const lock = fs.readFileSync('src-tauri/Cargo.lock','utf8');
          const ownPackage = lock.split('[[package]]').find(block => /name = "liao-tools"/.test(block));
          if (pkg.version !== version || tauri.version !== version ||
              !toml.includes('version = "' + version + '"') ||
              !ownPackage || !ownPackage.includes('version = "' + version + '"')) {
            throw new Error('Tag does not match checked-in versions');
          }
          const changelog = fs.readFileSync('CHANGELOG.md','utf8');
          const heading = '## [' + version + ']';
          const start = changelog.indexOf(heading);
          if (start < 0) throw new Error('Release notes are missing for ' + version);
          const next = changelog.indexOf('\n## [', start + heading.length);
          const notes = changelog.slice(start, next < 0 ? undefined : next).trim();
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'release_notes.txt'), notes + '\n');
          NODE
          {
            echo 'NOTES<<LIAO_RELEASE_NOTES'
            cat "${RUNNER_TEMP}/release_notes.txt"
            echo 'LIAO_RELEASE_NOTES'
          } >> "${GITHUB_OUTPUT}"
      - name: Build and attach release installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Liao Tools ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.NOTES }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check multi-platform installer assets and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ASSETS=$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')
          for required in \
            "liao-tools_${VERSION}_x64-setup.exe" \
            "liao-tools_${VERSION}_x64_en-US.msi" \
            "liao-tools_${VERSION}_aarch64.dmg" \
            "liao-tools_${VERSION}_x64.dmg" \
            "liao-tools_${VERSION}_universal.dmg"; do
            if ! grep -Fxq "${required}" <<< "${ASSETS}"; then
              echo "::error::Missing release installer: ${required}"
              exit 1
            fi
          done
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
          echo "Published ${GITHUB_REF_NAME} with Windows and macOS installers"
