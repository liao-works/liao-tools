name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libsoup-3.0-dev javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev
          # Tauri 2 可能需要 libnm-dev
          sudo apt-get install -y libnm-dev xdg-utils

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Only stable vMAJOR.MINOR.PATCH tags may publish a release."
            exit 1
          fi

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          # Install both targets for macOS to allow cross-compilation and universal build
          # And install Linux ARM target if needed
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || (contains(matrix.args, 'aarch64') && 'aarch64-unknown-linux-gnu' || '') }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Get version from tag
        id: get_version
        shell: bash
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          echo "Tag: $GITHUB_REF_NAME -> Version: ${GITHUB_REF_NAME#v}"

      - name: Update version in config files
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"

          # Update package.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          cd src-tauri
          # Update Cargo.toml
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          rm -f Cargo.toml.bak
          # Update tauri.conf.json
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('tauri.conf.json'));
            config.version = '$VERSION';
            fs.writeFileSync('tauri.conf.json', JSON.stringify(config, null, 2));
          "
          echo "Updated version to $VERSION"
          echo "--- package.json ---"
          head -5 ../package.json
          echo "--- Cargo.toml ---"
          head -5 Cargo.toml
          echo "--- tauri.conf.json ---"
          head -5 tauri.conf.json

      - name: Generate CHANGELOG
        id: changelog
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"

          # 使用 Node.js 脚本生成 CHANGELOG 并提取 release notes
          node scripts/generate-changelog.cjs $VERSION

          # 发布期间只生成当前 job 的内容；不要绕开 PR 审核自动 push master。
          echo "CHANGELOG prepared locally; default branch remains unchanged."

          # 保存 notes 到 output（所有平台都需要）
          # 使用 RUNNER_TEMP 获取跨平台临时目录
          NOTES_FILE="${RUNNER_TEMP}/release_notes.txt"
          # 使用随机 delimiter 避免内容冲突
          DELIMITER="RELEASE_NOTES_$(date +%s)"
          echo "NOTES<<${DELIMITER}" >> $GITHUB_OUTPUT
          cat "$NOTES_FILE" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "${DELIMITER}" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Fail-closed signed updater preflight
        shell: bash
        env:
          REQUIRE_SIGNED_UPDATER: ${{ vars.REQUIRE_SIGNED_UPDATER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/prepare-signed-release.cjs

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ vars.REQUIRE_SIGNED_UPDATER == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ vars.REQUIRE_SIGNED_UPDATER == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Liao Tools ${{ github.ref_name }}"
          releaseBody: ${{ steps.changelog.outputs.NOTES }}
          releaseDraft: true
          prerelease: false
          # Never allow matrix workers to race replacing latest.json. Only the
          # after-matrix publish job can assemble and upload the complete one.
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          args: ${{ matrix.args }}
  verify-and-publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate the complete signed updater manifest
        if: vars.REQUIRE_SIGNED_UPDATER == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p "${RUNNER_TEMP}/updater-signatures" "${RUNNER_TEMP}/downloaded-manifest"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.sig' --dir "${RUNNER_TEMP}/updater-signatures"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" \
            --jq '.assets' > "${RUNNER_TEMP}/release-assets.json"
          node scripts/build-signed-updater-manifest.cjs "$TAG" \
            "${RUNNER_TEMP}/release-assets.json" "${RUNNER_TEMP}/updater-signatures" \
            "${RUNNER_TEMP}/latest.json"
          # Merge all architectures only AFTER every matrix job completed.
          # A matrix job may have uploaded an incomplete latest.json.
          gh release upload "$TAG" "${RUNNER_TEMP}/latest.json" \
            --clobber --repo "$GITHUB_REPOSITORY"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'latest.json' --dir "${RUNNER_TEMP}/downloaded-manifest"
          cmp "${RUNNER_TEMP}/latest.json" "${RUNNER_TEMP}/downloaded-manifest/latest.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" \
            --jq '.assets' > "${RUNNER_TEMP}/published-assets.json"
          node scripts/verify-signed-release-manifest.cjs "$TAG" \
            "${RUNNER_TEMP}/published-assets.json" "${RUNNER_TEMP}/updater-signatures" \
            "${RUNNER_TEMP}/downloaded-manifest/latest.json"

      - name: Verify and publish only a complete release
        uses: actions/github-script@v7
        with:
          script: |
            const { checkRelease } = require('./scripts/verify-release-assets.cjs');
            const tag = context.ref.replace('refs/tags/', '');
            const { owner, repo } = context.repo;
            const response = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const release = response.data;
            const assets = await github.paginate(github.rest.repos.listReleaseAssets,
              { owner, repo, release_id: release.id, per_page: 100 });
            // Opt-in migration gate; the repository stays on the existing
            // user-confirmed updater until trusted pubkey/plugin are configured.
            const { checkSignedReleaseAssets } = require('./scripts/verify-release-assets.cjs');
            const requireSigned = ${{ vars.REQUIRE_SIGNED_UPDATER == 'true' }};
            const status = requireSigned
              ? checkSignedReleaseAssets(tag, assets)
              : checkRelease(tag, assets);
            if (!status.ok) {
              core.setFailed('Release verification failed: ' + status.issues.join(' | '));
              return;
            }
            if (!release.draft) {
              core.setFailed('Release became public before verification; refusing to mark success');
              return;
            }
            await github.rest.repos.updateRelease({
              owner, repo, release_id: release.id, draft: false, prerelease: false
            });
            core.info('Verified all release packages, SHA-256 digests and official URLs; release published');
