name: Tax snapshot checks (branch)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/src/commands/tax/**'
      - 'src-tauri/src/models/tax.rs'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src/lib/api/tax.ts'
      - 'src/features/tax/components/UpdateTab.tsx'
      - '.github/workflows/tax-data-checks.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tax code checks on supported Windows target
        working-directory: src-tauri
        run: |
          cargo test --locked --lib commands::tax::downloader -- --nocapture
          cargo test --locked --lib commands::tax::preview -- --nocapture
          cargo test --locked --lib commands::tax::signed -- --nocapture
          cargo test --locked --lib commands::tax::ni_review -- --nocapture
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
