name: Tax snapshot checks (branch)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/src/commands/tax/**'
      - 'src-tauri/src/models/tax.rs'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src/lib/api/tax.ts'
      - '.github/workflows/tax-data-checks.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies for Tauri 2
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config
      - name: Rust tax code checks
        working-directory: src-tauri
        run: cargo test --locked --lib commands::tax::downloader -- --nocapture
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
